name: Audit Saimo live catalog

on:
  push:
    branches: [fix/saimo-live-tv-complete]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/audit-saimo-live.mjs
