name: Verify premium sports and live fixture links
on:
  push:
    branches: [feat/agenda-futebol-premium-recovery, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  sports-premium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Unit regressions
        run: bun test tests/jogos-match.test.ts tests/jogos-broadcast.test.ts tests/standings.test.ts tests/football-ranking.test.ts tests/football-live.test.ts tests/football-providers-lineups.test.ts tests/sports-ticket-lineup.test.ts tests/sports-broadcast-verified.test.ts
      - name: Build application
        run: bun run build
      - name: Sports TypeScript validation
        run: bun scripts/typecheck-sports.mjs
      - name: Chrome mobile and desktop visual interaction test
        run: bun scripts/smoke-sports-ticket-browser.mjs
      - name: Preserve visual snapshots for inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zang-football-ticket-visual
          path: artifacts/sports-ticket-*.png
          if-no-files-found: warn
          retention-days: 7
