name: Verify ZANG FLIX navigation and hero
on:
  push:
    branches: [main]
    paths:
      - 'src/components/layout/**'
      - 'src/components/catalog/HeroSection.tsx'
      - 'src/components/catalog/Friday13Edition.tsx'
      - 'src/components/catalog/ZangsPicks.tsx'
      - 'src/components/catalog/MediaRow.tsx'
      - 'src/components/catalog/MediaCarousel.tsx'
      - 'src/lib/carousel-navigation.ts'
      - 'src/styles/cards.css'
      - 'tests/media-carousel.test.ts'
      - 'src/lib/zangs-picks.ts'
      - 'src/styles/home.css'
      - 'tests/zangs-picks.test.ts'
      - 'src/lib/friday13-edition.ts'
      - 'src/styles/friday13-edition.css'
      - 'src/styles/hero.css'
      - 'src/routes/index.tsx'
      - 'tests/friday13-edition.test.ts'
      - 'src/components/catalog/MobileCatalogFilters.tsx'
      - 'src/lib/mobile-catalog-filters.ts'
      - 'src/styles/mobile-catalog-filters.css'
      - 'tests/mobile-catalog-filters.test.ts'
      - 'src/lib/genre-matching.ts'
      - 'src/lib/hero-images.ts'
      - 'src/lib/backdrop-selection.ts'
      - 'src/lib/tmdb.ts'
      - 'tests/backdrop-selection.test.ts'
      - 'src/lib/device-profile.ts'
      - 'src/routes/animes.tsx'
      - 'src/routes/generos.$slug.tsx'
      - 'src/styles/navigation-premium.css'
      - 'src/styles/liquid-glass-nav.css'
      - 'src/styles/apple-glass-nav.css'
      - 'src/styles/reference-glass-dock.css'
      - 'src/styles/iconography.css'
      - 'src/components/icons/**'
      - 'scripts/audit-iconography.mjs'
      - 'src/styles/adaptive-navigation.css'
      - 'scripts/smoke-apple-glass-nav.mjs'
      - 'src/routes/__root.tsx'
      - 'tests/genre-matching.test.ts'
      - 'tests/hero-images.test.ts'
      - 'tests/liquid-glass-nav.test.ts'
      - 'tests/apple-glass-nav.test.ts'
      - 'tests/reference-glass-dock.test.ts'
      - '.github/workflows/verify-navigation-premium.yml'
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify genre matching and hero source selection
        run: bun test tests/media-carousel.test.ts tests/backdrop-selection.test.ts tests/zangs-picks.test.ts tests/friday13-edition.test.ts tests/genre-matching.test.ts tests/hero-images.test.ts tests/catalog-client.test.ts tests/liquid-glass-nav.test.ts tests/apple-glass-nav.test.ts tests/reference-glass-dock.test.ts tests/mobile-catalog-filters.test.ts
      - name: Audit icon consistency across every application screen
        run: node scripts/audit-iconography.mjs
      - name: Build site for visual browser checks
        run: bun run build
      - name: Verify real Chrome glass rendering on Android and desktop viewports
        run: bun scripts/smoke-apple-glass-nav.mjs
      - name: Save visual inspection screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zang-glass-mobile-desktop
          path: artifacts/apple-glass-*.png
          if-no-files-found: warn
          retention-days: 7
