name: Compare Lovable and Vercel TV production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-live-routing.mjs'
      - '.github/workflows/compare-lovable-vercel-live.yml'
permissions: { contents: read }
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Public Lovable TV routes
        env:
          LIVE_TEST_BASE: https://zangflix.lovable.app
        run: bun scripts/diagnose-live-routing.mjs
      - name: Public Vercel TV routes
        env:
          LIVE_TEST_BASE: https://zangflix.vercel.app
        run: bun scripts/diagnose-live-routing.mjs
