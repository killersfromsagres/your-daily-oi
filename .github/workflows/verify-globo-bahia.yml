name: Verify Globo Bahia HLS failover on Vercel and Lovable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-live-browser.mjs'
      - 'src/components/player/LivePlayer.tsx'
      - 'src/lib/tv-edge-backup.ts'
      - '.github/workflows/verify-globo-bahia.yml'
permissions: { contents: read }
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        site: [lovable, vercel]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Inspect video playback and route failover for 59 seconds
        env:
          LIVE_REMOTE_BASE_URL: ${{ matrix.site == 'lovable' && 'https://zangflix.lovable.app' || 'https://zangflix.vercel.app' }}
          LIVE_TEST_CHANNEL: globo-bahia
          LIVE_DIAGNOSTIC_LONG: "1"
        run: bun scripts/diagnose-live-browser.mjs
