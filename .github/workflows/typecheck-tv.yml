name: Typecheck Zang Live
on:
  push:
    branches: [feat/live-tv-studio-rebuild]
  workflow_dispatch:
jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Strict TypeScript diagnostics for TV modules
        run: bun scripts/typecheck-tv.mjs
