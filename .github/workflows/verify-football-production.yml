name: Verify real football fixtures and player lineup API
on:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke-football-production.mjs'
      - 'src/lib/jogos.ts'
      - 'src/lib/jogos-match.ts'
      - 'src/lib/football-backup.ts'
      - 'src/lib/football-lineups.ts'
      - 'src/lib/football-broadcasts.ts'
      - 'src/components/tv/JogosShelf.tsx'
      - 'src/components/sports/MatchLineups.tsx'
      - '.github/workflows/verify-football-production.yml'
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify published fixtures, country-specific TV and real lineup photographs
        run: bun scripts/smoke-football-production.mjs
