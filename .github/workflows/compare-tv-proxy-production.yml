name: Compare live proxy media across environments
on:
  push:
    branches: [main]
    paths:
      - 'scripts/compare-tv-proxy-production.mjs'
      - 'vercel.json'
      - '.github/workflows/compare-tv-proxy-production.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Compare representative public live proxy responses
        run: bun scripts/compare-tv-proxy-production.mjs
