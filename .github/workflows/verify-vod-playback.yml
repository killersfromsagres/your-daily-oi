name: Verificar reprodução Saimo VOD

on:
  push:
    branches: [fix/vod-playback-saimo-parity, main]
  pull_request:
    branches: [main]

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Testes de filmes, séries, animes, HLS e MP4
        run: bun test tests/saimo-playback.test.ts tests/saimo-integration.test.ts tests/player-recovery.test.ts tests/vod-reliability.test.ts tests/vod-source-quality.test.ts
      - name: Verificação TypeScript dos módulos VOD
        run: bun scripts/typecheck-vod.mjs
      - name: Build de produção
        run: bun run build
      - name: Smoke-test da rota no preview de produção
        run: bun scripts/smoke-vod-preview.mjs
      - name: Diagnóstico de redirecionamento Saimo (sem baixar filmes)
        run: bun scripts/inspect-vod-redirect.mjs
