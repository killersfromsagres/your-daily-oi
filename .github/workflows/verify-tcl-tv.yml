name: Verify ZANG FLIX dedicated TV app
on:
  pull_request:
    paths:
      - 'src/routes/tv-home.tsx'
      - 'src/lib/tv-library-catalog.ts'
      - 'src/lib/tv-grid.ts'
      - 'src/components/tv/TvLibrary.tsx'
      - 'tests/tv-library-premium.test.ts'
      - 'src/lib/tv-featured.ts'
      - 'src/lib/tv-hero-art.ts'
      - 'src/lib/tv-featured-candidates.ts'
      - 'src/lib/tv-hero-client.ts'
      - 'src/lib/tv-build.ts'
      - 'tests/tv-featured-candidates.test.ts'
      - 'tests/tv-hero-client.test.ts'
      - 'src/lib/tv-playback-plan.ts'
      - 'src/components/player/TvStreamPlayer.tsx'
      - 'src/components/icons/TvAnimeFrameIcon.tsx'
      - 'src/lib/tv-playback-optimizer.ts'
      - 'tests/tv-theater-latency.test.ts'
      - 'tests/tv-featured.test.ts'
      - 'tests/tv-web-isolation.test.ts'
      - 'src/components/player/LivePlayer.tsx'
      - 'src/routes/tv-live.tsx'
      - 'src/routes/tv-title.tsx'
      - 'src/lib/tv-focus.ts'
      - 'src/styles/tv-cinema.css'
      - 'tests/tv-focus.test.ts'
      - 'src/styles/tv-home.css'
      - 'src/routes/tv-app.tsx'
      - 'src/server.ts'
      - 'src/routes/__root.tsx'
      - 'android/**'
      - 'tv/**'
      - 'tests/tv-home.test.ts'
      - 'tests/tv-web-isolation.test.ts'
      - '.github/workflows/verify-tcl-tv.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/tv-home.tsx'
      - 'src/lib/tv-featured.ts'
      - 'src/lib/tv-hero-art.ts'
      - 'src/lib/tv-featured-candidates.ts'
      - 'src/lib/tv-hero-client.ts'
      - 'src/lib/tv-build.ts'
      - 'tests/tv-featured-candidates.test.ts'
      - 'tests/tv-hero-client.test.ts'
      - 'src/lib/tv-playback-plan.ts'
      - 'src/components/player/TvStreamPlayer.tsx'
      - 'tests/tv-featured.test.ts'
      - 'tests/tv-web-isolation.test.ts'
      - 'src/components/player/LivePlayer.tsx'
      - 'src/routes/tv-live.tsx'
      - 'src/routes/tv-title.tsx'
      - 'src/lib/tv-focus.ts'
      - 'src/styles/tv-cinema.css'
      - 'tests/tv-focus.test.ts'
      - 'src/styles/tv-home.css'
      - 'src/routes/tv-app.tsx'
      - 'src/server.ts'
      - 'src/routes/__root.tsx'
      - 'android/**'
      - 'tv/**'
      - '.github/workflows/verify-tcl-tv.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: TV navigation and installation tests
        run: bun test tests/tv-library-premium.test.ts tests/tv-theater-latency.test.ts tests/tv-web-isolation.test.ts tests/tv-home.test.ts tests/tv-featured-candidates.test.ts tests/tv-hero-client.test.ts tests/tv-featured.test.ts tests/tv-live-recovery.test.ts tests/tv-focus.test.ts tests/tv-app-design.test.ts tests/tv-install.test.ts tests/search-autocomplete.test.ts
      - name: Compile client and server routes
        run: bun run build
      - name: Strict TypeScript diagnostics for new TV modules
        run: bun scripts/typecheck-tcl.mjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Verify two distinct TV/mobile flavors
        working-directory: android
        run: gradle --no-daemon assembleMobileDebug assembleTelevisionDebug
      - name: Check package identities and TV launcher
        run: |
          SDK="$ANDROID_HOME/build-tools/35.0.0/aapt"
          MOBILE="android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk"
          TV="android/app/build/outputs/apk/television/debug/app-television-debug.apk"
          test -s "$MOBILE" && test -s "$TV"
          "$SDK" dump badging "$MOBILE" | grep -F "package: name='com.zangflix.app'"
          "$SDK" dump badging "$TV" | grep -F "package: name='com.zangflix.tv'"
          "$SDK" dump badging "$TV" | grep -F "leanback-launchable-activity"
