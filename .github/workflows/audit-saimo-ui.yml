name: Audit public Saimo TV frontend
on:
  push:
    branches: [feat/live-tv-studio-rebuild]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/audit-saimo-ui.mjs
