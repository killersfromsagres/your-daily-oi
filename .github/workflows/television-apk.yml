name: Build and publish ZANG FLIX TV only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/television-apk.yml'
permissions:
  contents: write
concurrency:
  group: zangflix-tv-release
  cancel-in-progress: false
jobs:
  television:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK
        run: |
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"
      - name: Generate TV launcher assets
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 android/scripts/build-icons.py
          python3 android/scripts/build-tv-icons.py
      - name: Build television APK only
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleTelevisionDebug
      - name: Verify TV APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/television/debug/app-television-debug.apk dist/ZANG-FLIX-TV.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging dist/ZANG-FLIX-TV.apk | grep -F "package: name='com.zangflix.tv' versionCode='13' versionName='2.8.0'"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging dist/ZANG-FLIX-TV.apk | grep -F 'leanback-launchable-activity'
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose dist/ZANG-FLIX-TV.apk
          (cd dist && sha256sum ZANG-FLIX-TV.apk > SHA256SUMS-TV.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ZANG-FLIX-TV-2.8.0
          path: dist/
          if-no-files-found: error
      - name: Publish separate TV release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tv-latest >/dev/null 2>&1; then
            gh release upload tv-latest dist/ZANG-FLIX-TV.apk dist/SHA256SUMS-TV.txt --clobber
            gh release edit tv-latest --title "ZANG FLIX TV 2.8.0 — TCL Android TV / Google TV"
          else
            gh release create tv-latest dist/ZANG-FLIX-TV.apk dist/SHA256SUMS-TV.txt --title "ZANG FLIX TV 2.8.0 — TCL Android TV / Google TV" --notes "Aplicativo exclusivo para TV Android/Google TV. A interface é hospedada no Lovable e exige a publicação da versão web TV correspondente. APK de depuração; a atualização sobre um APK anterior depende de assinatura compatível."
          fi
          gh release view tv-latest --json assets --jq '.assets[].name' | grep -Fx 'ZANG-FLIX-TV.apk'
