name: Audit every Saimo and ZANG FLIX TV channel
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-all-tv-channels.mjs'
      - 'scripts/compare-saimo-zang-tv.mjs'
      - 'scripts/diagnose-live-browser.mjs'
      - 'src/lib/live-source.ts'
      - 'src/lib/live-proxy-transport.ts'
      - 'tests/live-proxy-transport.test.ts'
      - 'tests/tv-channel-connection.test.ts'
      - 'src/components/tv/ChannelCard.tsx'
      - 'src/components/tv/TvView.tsx'
      - 'src/components/player/LivePlayer.tsx'
      - 'src/lib/canais.ts'
      - 'src/server.ts'
      - 'tests/live-tv.test.ts'
      - '.github/workflows/audit-all-tv-channels.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify live catalog and source identity
        run: bun test tests/live-tv.test.ts tests/live-proxy-transport.test.ts tests/live-playback-watchdog.test.ts tests/tv-channel-connection.test.ts
      - name: Probe all declared origin streams
        run: bun scripts/audit-all-tv-channels.mjs
      - name: Compare all catalog entries and accessible Saimo/ZANG proxy candidates
        run: bun scripts/compare-saimo-zang-tv.mjs
        env:
          PARITY_CONCURRENCY: '6'
          PARITY_TIMEOUT_MS: '5500'
      # Probe whether the actual HTML video clock advances in Chromium.
      # Third-party availability varies by region; snapshots are diagnostic,
      # not an assertion that a protected origin must be unlocked.
      - name: Build the real TV player
        run: bun run build
      - name: Browser playback diagnostics (Band and SBT)
        run: |
          LIVE_TEST_CHANNEL=band LIVE_REQUIRE_PLAYBACK=1 LIVE_VERIFY_RESUME=1 bun scripts/diagnose-live-browser.mjs
          LIVE_TEST_CHANNEL=sbt LIVE_REQUIRE_PLAYBACK=1 bun scripts/diagnose-live-browser.mjs
      - name: Browser playback diagnostics (TV Câmara)
        run: LIVE_TEST_CHANNEL=tv-camara bun scripts/diagnose-live-browser.mjs
      # Record honest observations for the categories users report as broken.
      # HTTP 403/DRM/absent authorized sources are not forced to pass.
      - name: Browser playback diagnostics (SporTV and HBO)
        run: |
          LIVE_TEST_CHANNEL=sportv bun scripts/diagnose-live-browser.mjs
          LIVE_TEST_CHANNEL=hbo bun scripts/diagnose-live-browser.mjs
      - name: Save full per-channel and per-source reports, without stream tokens
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zang-saimo-full-tv-audit
          path: |
            artifacts/tv-health-audit.json
            artifacts/tv-saimo-zang-parity.json
            artifacts/tv-saimo-zang-parity.csv
          if-no-files-found: warn
          retention-days: 14
