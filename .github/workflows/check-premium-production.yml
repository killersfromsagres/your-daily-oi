name: Verify live production premium experience
on:
  push:
    branches: [verify/premium-live-deploy]
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check published football, TV and agenda routes
        run: bun scripts/check-premium-public.mjs
