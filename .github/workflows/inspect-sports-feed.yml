name: Inspect football fixture feeds
on:
  push:
    branches: [feat/sports-match-center]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/inspect-sports-feed.mjs
